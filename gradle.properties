# Done to increase the memory available to gradle.
# NeoForge's first sync decompiles Minecraft; 1G was the Fabric value, 3G is what NeoForge's templates use.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge (NeoForge) and https://projects.neoforged.net/neoforged/moddevgradle (plugin)
minecraft_version=1.21.11
# 1.21.11 is the last 1.21 release (the next one is 26.1), so the range is that one version, like NeoForge's own 1.21.11 template.
minecraft_version_range=[1.21.11]
neoforge_version=21.11.45
loader_version_range=[4,)
moddev_version=2.0.148

# Mod Properties
mod_id=tastyvanilla
mod_version=2.2
maven_group=tastyvanilla
