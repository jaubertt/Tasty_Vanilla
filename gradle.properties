# Done to increase the memory available to gradle.
# Three modules plus the NeoForge decompile need more than the 1G the single Fabric project used.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Project
# Every property used inside fabric.mod.json or neoforge.mods.toml must also be in the expandProps
# map in build-logic/src/main/groovy/multiloader-common.gradle.
version=2.2
group=tastyvanilla
java_version=25

# Common (Minecraft)
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
mod_id=tastyvanilla
mod_name=TastyVanilla
mod_author=Jaubert
license=ARR
credits=
description=Tasty Vanilla brings an array of exciting culinary and farming adventures to Minecraft while maintaining the familiar feel of the game's classic mechanics.
# NeoForm gives the common module the vanilla sources. Versions: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric, check these on https://fabricmc.net/develop
loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.3
fabric_version=0.154.0+26.2

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge and https://projects.neoforged.net/neoforged/moddevgradle
moddev_version=2.0.148
neoforge_version=26.2.0.88
neoforge_loader_version_range=[4,)
