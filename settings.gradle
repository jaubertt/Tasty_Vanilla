pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
			}
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Matches the folder name, as the MultiLoader Template asks (IDEA complains otherwise).
rootProject.name = 'Tasty Vanilla'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
