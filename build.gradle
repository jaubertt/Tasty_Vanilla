// NeoForge build of Tasty Vanilla (branch 26.2-neoforge). The Fabric build lives on branch 26.2.
plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

// Default base name for archive tasks; the two jars you upload are named below the jar block.
base {
	archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

neoForge {
	// To change the versions see the gradle.properties file
	version = project.neoforge_version

	runs {
		client {
			client()
			ideName = 'NeoForge Client'
			// Its own folder inside run/ (gitignored). Fabric's test worlds stay in run/saves and are never
			// opened by NeoForge, which would drop anything NeoForge doesn't have (the 2.2.1 corn and rice).
			gameDirectory = this.mkdir(this.file('run/neoforge'))
		}
		server {
			server()
			ideName = 'NeoForge Server'
			gameDirectory = this.mkdir(this.file('run/neoforge/server'))
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

// The Data Generation output of the Fabric branch (src/main/generated) ships in this jar too.
// NeoForge runs no Data Generation here; regenerate on the Fabric branch and copy the folder over.
sourceSets.main.resources {
	srcDir 'src/main/generated'
}

processResources {
	// Fabric's datagen cache and Finder metadata never belong in the jar.
	exclude '.cache/**'
	exclude '**/.DS_Store'

	def props = [
			version                : project.version,
			minecraft_version_range: project.minecraft_version_range,
			neoforge_version       : project.neoforge_version,
			loader_version_range   : project.loader_version_range
	]
	inputs.properties props

	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Jar file names, the same pattern every release:
// "Tasty Vanilla-2.2-neoforge-26.2.jar" and "Tasty Vanilla-2.2-neoforge-26.2-sources.jar".
// The numbers come from mod_version and minecraft_version in gradle.properties.
def releaseName = "Tasty Vanilla-${project.mod_version}-neoforge-${project.minecraft_version}".toString()
tasks.named('jar') {
	archiveFileName = releaseName + '.jar'
}
tasks.named('sourcesJar') {
	archiveFileName = releaseName + '-sources.jar'
}

// iCloud Drive sometimes copies files as "name 2.json" or folders as "recipe 2".
// Minecraft rejects those names, so keep them out of every jar this project builds.
tasks.withType(AbstractArchiveTask).configureEach {
	exclude { element -> element.relativePath.segments.any { it ==~ /.+ \d+(\.[^.]+)?/ } }
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}
