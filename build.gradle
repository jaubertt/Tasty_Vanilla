plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

neoForge {
	// To change the versions see the gradle.properties file
	version = project.neoforge_version

	runs {
		client {
			client()
			ideName = 'NeoForge Client'
			// One game folder per Minecraft version, separate from the Fabric worlds in run/saves
			gameDirectory = this.mkdir(this.file("run/neoforge-${project.minecraft_version}"))
		}
		server {
			server()
			ideName = 'NeoForge Server'
			gameDirectory = this.mkdir(this.file("run/neoforge-${project.minecraft_version}/server"))
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

// Data Generation output from the Fabric branch
sourceSets.main.resources {
	srcDir 'src/main/generated'
}

processResources {
	exclude '.cache/**'
	exclude '**/.DS_Store'

	def props = [
			version                : project.version,
			minecraft_version_range: project.minecraft_version_range,
			neoforge_version       : project.neoforge_version,
			loader_version_range   : project.loader_version_range
	]
	inputs.properties props

	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Tasty Vanilla-<mod_version>-neoforge-<minecraft_version>.jar
def releaseName = "Tasty Vanilla-${project.mod_version}-neoforge-${project.minecraft_version}".toString()
tasks.named('jar') {
	archiveFileName = releaseName + '.jar'
}
tasks.named('sourcesJar') {
	archiveFileName = releaseName + '-sources.jar'
}

// iCloud Drive sometimes copies files as "name 2.json" or folders as "recipe 2".
// Minecraft rejects those names, so keep them out of every jar this project builds.
tasks.withType(AbstractArchiveTask).configureEach {
	exclude { element -> element.relativePath.segments.any { it ==~ /.+ \d+(\.[^.]+)?/ } }
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
	}
}
