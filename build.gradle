// Root build: only declares the loader plugins. The modules are common/, fabric/ and neoforge/.
// Shared build logic lives in build-logic/src/main/groovy (multiloader-common, multiloader-loader).
plugins {
	// see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	// see https://projects.neoforged.net/neoforged/moddevgradle for new versions
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}
